<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Opportunities · HYB Opportunity AI</title>
<style>body{font:16px/1.5 system-ui;margin:0;color:#17202a}main{width:min(72rem,100%);margin:auto;padding:1.25rem}.state{padding:1rem;background:#f5f7f9;border-left:5px solid #174a72}.cards{display:grid;gap:1rem}.card{border:1px solid #ccd3da;border-radius:.5rem;padding:1rem}a:focus-visible,button:focus-visible{outline:3px solid #1685d1;outline-offset:3px}@media(min-width:48rem){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>Opportunities</h1><p>Open an admitted Opportunity and create or continue its Founder Review.</p><p><a href="/reviews">Review queue</a></p><div id="status" class="state" role="status" aria-live="polite">Loading opportunities…</div><section aria-labelledby="items-title"><h2 id="items-title">Admitted opportunities</h2><div id="items" class="cards"></div></section></main>
<script>(()=>{"use strict";const items=document.getElementById("items"),status=document.getElementById("status");const add=(parent,tag,text)=>{const node=document.createElement(tag);node.textContent=text;parent.append(node);return node};async function load(){try{const response=await fetch("/api/v1/opportunities");if(!response.ok)throw new Error();const data=await response.json();items.replaceChildren();data.items.forEach(value=>{const card=document.createElement("article");card.className="card";add(card,"h3",value.opportunity_id);add(card,"p",`Status: ${value.status}`);add(card,"p",`Discovery reference: ${value.discovery_reference}`);add(card,"p",value.review_bound?`Review: ${value.review_status}`:"Review: not created");const link=add(card,"a","Open opportunity");link.href=`/opportunities/${encodeURIComponent(value.opportunity_id)}`;items.append(card)});status.textContent=`Loaded ${data.total_count} opportunities.`}catch(_){status.textContent="Opportunity persistence is unavailable."}}load()})();</script></body></html>
