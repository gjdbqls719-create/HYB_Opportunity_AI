<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HYB Opportunity AI</title>
    <style>
        body {
            margin: 0;
            padding: 1rem;
            font-family: sans-serif;
            line-height: 1.5;
        }

        main {
            max-width: 60rem;
            margin: 0 auto;
        }

        #search-form {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: end;
        }

        #query {
            flex: 1 1 18rem;
            min-width: 0;
            padding: 0.5rem;
        }

        #search-button {
            padding: 0.5rem 1rem;
        }

        .state-message {
            margin: 1rem 0;
            padding: 0.75rem;
            background: #f5f5f5;
        }

        #error-message {
            border-left: 0.25rem solid #a00000;
        }

        #results {
            display: grid;
            gap: 1rem;
            margin-top: 1rem;
        }

        .opportunity-card {
            border: 1px solid #cccccc;
            border-radius: 0.25rem;
            padding: 1rem;
        }

        .opportunity-score {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .opportunity-card dl {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 0.5rem 1rem;
        }

        .opportunity-card dd {
            margin: 0;
        }

        @media (max-width: 36rem) {
            .opportunity-card dl {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>HYB Opportunity AI</h1>
        <form id="search-form">
            <label for="query">Search products</label>
            <input id="query" name="query" type="search">
            <button id="search-button" type="submit">Search</button>
        </form>
        <p id="loading" class="state-message" role="status" hidden>
            Searching...
        </p>
        <p id="summary" class="state-message" role="status"
           aria-live="polite" hidden></p>
        <p id="error-message" class="state-message" role="alert" hidden>
            Search failed.
        </p>
        <section id="results" aria-live="polite">
            <p id="initial-empty-state" class="state-message">
                Start searching to discover opportunities.
            </p>
        </section>
    </main>
    <script>
        const searchForm = document.getElementById("search-form");
        const queryInput = document.getElementById("query");
        const searchButton = document.getElementById("search-button");
        const loadingIndicator = document.getElementById("loading");
        const summary = document.getElementById("summary");
        const errorMessage = document.getElementById("error-message");
        const resultsContainer = document.getElementById("results");

        function formatAmount(value, currency) {
            return `${value} ${currency}`.trim();
        }

        function renderOpportunities(opportunities) {
            resultsContainer.replaceChildren();

            if (opportunities.length === 0) {
                const emptyMessage = document.createElement("p");
                emptyMessage.textContent = "No opportunities found.";
                resultsContainer.append(emptyMessage);
                return;
            }

            for (const opportunity of opportunities) {
                const product = opportunity.product;
                const metrics = opportunity.metrics;
                const card = document.createElement("article");
                const title = document.createElement("h2");
                const marketplace = document.createElement("p");
                const score = document.createElement("p");
                const details = document.createElement("dl");
                const values = [
                    ["ROI", `${metrics.roi}%`],
                    [
                        "Expected Selling Price",
                        formatAmount(
                            metrics.expected_selling_price,
                            product.currency,
                        ),
                    ],
                    [
                        "Net Profit",
                        formatAmount(
                            metrics.net_profit,
                            product.currency,
                        ),
                    ],
                ];

                card.className = "opportunity-card";
                title.textContent = product.title;
                marketplace.textContent = `Marketplace: ${product.marketplace}`;
                score.className = "opportunity-score";
                score.textContent =
                    `Final Opportunity Score: ${metrics.final_opportunity_score}`;

                for (const [label, value] of values) {
                    const term = document.createElement("dt");
                    const description = document.createElement("dd");

                    term.textContent = label;
                    description.textContent = value;
                    details.append(term, description);
                }

                card.append(title, marketplace, score, details);
                resultsContainer.append(card);
            }
        }

        async function searchOpportunities() {
            const query = queryInput.value.trim();

            if (!query) {
                return;
            }

            searchButton.disabled = true;
            loadingIndicator.hidden = false;
            summary.hidden = true;
            errorMessage.hidden = true;
            resultsContainer.replaceChildren();

            try {
                const response = await fetch("/api/v1/opportunities/search", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        query,
                        limit: 10,
                        top: 5,
                    }),
                });

                if (!response.ok) {
                    throw new Error("Search request failed");
                }

                const data = await response.json();
                renderOpportunities(data.dashboard_cards);
                summary.textContent =
                    `Found ${data.dashboard_cards.length} opportunities for "${data.query}"`;
                summary.hidden = false;
            } catch (error) {
                errorMessage.hidden = false;
            } finally {
                searchButton.disabled = false;
                loadingIndicator.hidden = true;
            }
        }

        searchForm.addEventListener("submit", (event) => {
            event.preventDefault();
            searchOpportunities();
        });
    </script>
</body>
</html>
